spring: "1.0"

name: Mantis React Dashboard Setup
description: Setup for Mantis Free React Material UI Dashboard Template - a Vite-powered React application

prerequisites:
  - name: Node.js (v22+)
    check: "node --version | grep -E \"v(22|23|24|25|26)\\.\" || (echo \"Node.js v22+ required\" && exit 1)"
    required: true

steps:
  - name: Kill port 3000 if in use
    run: npx kill-port 3000 || true
    optional: true
  - name: Install dependencies
    run: npm install
    timeout: "10m"
  - name: Start development server
    run: npm start
    background: true
    ready_when:
      type: http
      url: "http://localhost:3000"
      timeout: "180s"
